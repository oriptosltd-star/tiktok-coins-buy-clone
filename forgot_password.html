<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Cheaper360</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .auth-card { width: 100%; max-width: 400px; padding: 40px; text-align: center; }
        .title { font-size: 24px; font-weight: 800; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #161823; }
        .input-field { width: 100%; padding: 12px; border: 1px solid #E8E8E8; border-radius: 8px; font-size: 15px; background: #F8F9FA; box-sizing: border-box; }
        .btn-primary { background: #FE2C55; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 16px; }
        .btn-primary:hover { background: #E6284C; }
        .link { color: #FE2C55; text-decoration: none; font-weight: 600; font-size: 14px; display: block; margin-top: 24px; }
        
        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .btn-modal {
            background: #FE2C55;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="title">Reset Password</div>
        <p style="color: #8A8B91; font-size: 14px; margin-bottom: 30px;">Enter your email to receive a password reset link.</p>
        
        <form id="resetForm" onsubmit="handleReset(event)">
            <div class="input-group">
                <label><i class="ri-mail-line"></i> Email Address</label>
                <input type="email" id="email" class="input-field" required placeholder="name@example.com">
            </div>
            <button type="submit" class="btn-primary" id="btnSubmit">Send Link</button>
        </form>
        <a href="login.html" class="link"><i class="ri-arrow-left-line"></i> Back to Login</a>
    </div>

    <!-- Professional Modal -->
    <div id="alertModal" class="modal-overlay">
        <div class="modal-content">
            <div id="alertIcon" style="font-size: 48px; margin-bottom: 16px;"></div>
            <div id="alertTitle" style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Notice</div>
            <p id="alertMessage" style="color: #8A8B91; font-size: 14px; margin-bottom: 16px; line-height: 1.5;"></p>
            <button onclick="closeModal()" class="btn-modal">Okay</button>
        </div>
    </div>

    <script>
        async function handleReset(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btnSubmit');
            
            btn.innerText = 'Sending...';
            btn.disabled = true;

            try {
                const res = await fetch('reset_request.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showModal("Check Email", "If an account exists, a reset link has been sent.", "success");
                } else {
                    showModal("Error", data.error || "Failed to send", "error");
                }
            } catch (err) {
                showModal("Failed", "Connection error. Try again.", "error");
            } finally {
                btn.innerText = 'Send Link';
                btn.disabled = false;
            }
        }

        function showModal(title, msg, type) {
            const icon = document.getElementById('alertIcon');
            if (type === 'success') {
                icon.innerHTML = '<i class="ri-checkbox-circle-fill" style="color: #25C953;"></i>';
            } else {
                icon.innerHTML = '<i class="ri-error-warning-fill" style="color: #FE2C55;"></i>';
            }
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('alertModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('alertModal').style.display = 'none';
        }
    </script>
</body>
</html>
